name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ToolDock.sln

      - name: Build
        run: dotnet build ToolDock.sln -c Release --no-restore

      - name: Publish Windows executables
        shell: pwsh
        run: |
          dotnet publish src/ToolDock.Starter/ToolDock.Starter.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -o artifacts/starter
          dotnet publish src/ToolDock.Updater/ToolDock.Updater.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -o artifacts/updater
          dotnet publish tests/ToolDock.SmokeTool/ToolDock.SmokeTool.csproj -c Release --no-restore -o artifacts/smoke-tool

      - name: Test process supervision
        shell: pwsh
        run: tests/smoke.ps1 -StarterPath artifacts/starter/starter.exe -ToolDirectory artifacts/smoke-tool

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/package/bin -Force | Out-Null
          Copy-Item artifacts/starter/starter.exe artifacts/package/bin/starter.exe
          Copy-Item artifacts/updater/updater.exe artifacts/package/bin/updater.exe
          Compress-Archive -Path artifacts/package/* -DestinationPath artifacts/ToolDock-win-x64.zip
          $hash = (Get-FileHash artifacts/ToolDock-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ToolDock-win-x64.zip" | Set-Content artifacts/ToolDock-win-x64.zip.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: ToolDock-win-x64
          path: |
            artifacts/ToolDock-win-x64.zip
            artifacts/ToolDock-win-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag artifacts/ToolDock-win-x64.zip artifacts/ToolDock-win-x64.zip.sha256 --clobber
          } else {
            gh release create $tag artifacts/ToolDock-win-x64.zip artifacts/ToolDock-win-x64.zip.sha256 --generate-notes --title $tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    permissions:
      contents: write
