name: Build and release

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      TOOLDOCK_VERSION: 0.2.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ToolDock.sln

      - name: Build
        run: dotnet build ToolDock.sln -c Release --no-restore -p:Version=$env:TOOLDOCK_VERSION

      - name: Test Windows PowerShell installer compatibility
        shell: powershell
        run: tests/install-script.ps1 -InstallerPath install.ps1

      - name: Publish Windows executables
        shell: pwsh
        run: |
          dotnet publish src/ToolDock.Starter/ToolDock.Starter.csproj -c Release -r win-x64 --self-contained false --no-restore -p:DebugType=None -p:Version=$env:TOOLDOCK_VERSION -o artifacts/starter
          dotnet publish src/ToolDock.Updater/ToolDock.Updater.csproj -c Release -r win-x64 --self-contained false --no-restore -p:DebugType=None -p:Version=$env:TOOLDOCK_VERSION -o artifacts/updater
          dotnet publish src/ToolDock.Client/ToolDock.Client.csproj -c Release -r win-x64 --self-contained false --no-restore -p:DebugType=None -p:Version=$env:TOOLDOCK_VERSION -o artifacts/client
          dotnet publish tests/ToolDock.SmokeTool/ToolDock.SmokeTool.csproj -c Release --no-restore -o artifacts/smoke-tool

      - name: Test updater mutex cleanup
        shell: pwsh
        run: tests/updater.ps1 -UpdaterPath artifacts/updater/ToolDock.Updater.exe

      - name: Test client output
        shell: pwsh
        run: tests/client.ps1 -ClientPath artifacts/client/ToolDock.Client.exe

      - name: Test process supervision
        shell: pwsh
        run: tests/smoke.ps1 -StarterPath artifacts/starter/ToolDock.Starter.exe -ClientPath artifacts/client/ToolDock.Client.exe -ToolDirectory artifacts/smoke-tool

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/package/bin -Force | Out-Null
          Copy-Item artifacts/starter/* artifacts/package/bin -Exclude *.pdb -Force
          Copy-Item artifacts/updater/* artifacts/package/bin -Exclude *.pdb -Force
          Copy-Item artifacts/client/* artifacts/package/bin -Exclude *.pdb -Force
          Compress-Archive -Path artifacts/package/* -DestinationPath artifacts/ToolDock-win-x64.zip
          $archiveSize = (Get-Item artifacts/ToolDock-win-x64.zip).Length
          if ($archiveSize -gt 5MB) { throw "Framework-dependent release is unexpectedly large: $archiveSize bytes" }
          $hash = (Get-FileHash artifacts/ToolDock-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ToolDock-win-x64.zip" | Set-Content artifacts/ToolDock-win-x64.zip.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v7
        with:
          name: ToolDock-win-x64
          path: |
            artifacts/ToolDock-win-x64.zip
            artifacts/ToolDock-win-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:TOOLDOCK_VERSION"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag artifacts/ToolDock-win-x64.zip artifacts/ToolDock-win-x64.zip.sha256 --clobber
          } else {
            gh release create $tag artifacts/ToolDock-win-x64.zip artifacts/ToolDock-win-x64.zip.sha256 --target $env:GITHUB_SHA --generate-notes --title $tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    permissions:
      contents: write
